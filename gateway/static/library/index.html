<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>研究资料库 · NoviceSynapse</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/library/styles.css" />
  </head>
  <body>
    <main class="library-shell">
      <aside class="sidebar">
        <a class="brand" href="/">NoviceSynapse</a>
        <div class="sidebar-copy"><span>LOCAL RESEARCH SPACE</span><strong>研究资料库</strong></div>
        <nav id="library-nav" aria-label="资料库分类">
          <button class="nav-item is-active" data-view="conversations"><span class="nav-icon">◌</span><span>会话</span><b data-count="conversations">0</b></button>
          <button class="nav-item" data-view="domain-onboardings"><span class="nav-icon">◇</span><span>领域入门</span><b data-count="domain_onboardings">0</b></button>
          <button class="nav-item" data-view="paper-readings"><span class="nav-icon">▤</span><span>论文精读</span><b data-count="paper_readings">0</b></button>
          <button class="nav-item" data-view="papers"><span class="nav-icon">▱</span><span>论文管理</span><b data-count="library_papers">0</b></button>
        </nav>
        <div class="sidebar-actions"><a href="/app?new=1" class="primary-link">＋ 新会话</a><a href="/settings" class="quiet-link">配置</a></div>
      </aside>

      <section class="content">
        <header class="content-header">
          <div><p id="view-kicker" class="eyebrow">CONVERSATIONS</p><h1 id="view-title">会话</h1><p id="view-description">回到最近的科研讨论，保留每一次问题演进。</p></div>
          <a href="/app?new=1" class="mobile-new">＋ 新建</a>
        </header>
        <div class="toolbar">
          <label class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="搜索标题或内容" autocomplete="off" /></label>
          <div id="paper-scope" class="paper-scope" hidden>
            <label class="scope-switch"><input id="show-all-papers" type="checkbox" /><span>显示全部论文</span></label>
            <span id="folder-breadcrumb" class="folder-breadcrumb">全部论文</span>
            <div id="reading-filter" class="reading-filter" role="radiogroup" aria-label="精读状态筛选">
              <button class="is-active" type="button" role="radio" aria-checked="true" data-reading-filter="all">全部</button>
              <button type="button" role="radio" aria-checked="false" data-reading-filter="reviewed">已精读</button>
              <button type="button" role="radio" aria-checked="false" data-reading-filter="unreviewed">未精读</button>
            </div>
            <button id="create-folder-button" class="folder-create-button" type="button"><span>＋</span> 新建文件夹</button>
          </div>
        </div>
        <div id="records-layout" class="records-layout">
          <aside id="folder-pane" class="folder-pane" hidden>
            <header><div><span>LIBRARY</span><strong>我的文件夹</strong></div><button id="folder-root-create" type="button" title="新建顶层文件夹">＋</button></header>
            <nav id="folder-tree" class="folder-tree" aria-label="论文文件夹"></nav>
          </aside>
          <div class="records-content">
            <section id="paper-import" class="paper-import" hidden>
              <div><strong>添加论文</strong><span>上传 PDF 或粘贴 PDF 链接，导入后自动进入论文管理。</span></div>
              <input id="paper-file-input" type="file" accept="application/pdf,.pdf" hidden />
              <button id="paper-file-button" class="paper-file-button" type="button"><span>↥</span><span id="paper-file-label">选择 PDF</span></button>
              <input id="paper-url-input" type="url" placeholder="https://…/paper.pdf" />
              <button id="import-folder-button" class="folder-dropzone" type="button">
                <span class="folder-drop-icon">↥</span>
                <span class="folder-drop-copy"><strong>选择文件夹</strong><small id="import-folder-label">未放入文件夹</small></span>
              </button>
              <button id="paper-import-button" type="button">添加到论文管理</button>
            </section>
            <section id="result-summary" class="result-summary"></section>
            <section id="items" class="items" aria-live="polite"></section>
            <section id="empty-state" class="empty-state" hidden><span>✦</span><h2 id="empty-title">这里还没有内容</h2><p id="empty-copy">从一次新会话开始，结果会自动出现在这里。</p><a href="/app">开始使用</a></section>
          </div>
        </div>
      </section>
    </main>
    <dialog id="folder-form-dialog" class="folder-dialog">
      <form id="folder-form" method="dialog">
        <header><div><span>FOLDER</span><h2 id="folder-form-title">新建文件夹</h2></div><button class="dialog-icon-button" type="button" data-close-dialog="folder-form-dialog">×</button></header>
        <label class="dialog-field"><span>文件夹名称</span><input id="folder-name-input" maxlength="80" autocomplete="off" required /></label>
        <fieldset><legend>所在位置</legend><div id="folder-parent-tree" class="dialog-folder-tree"></div></fieldset>
        <p id="folder-form-error" class="dialog-error" hidden></p>
        <footer><button class="dialog-secondary" type="button" data-close-dialog="folder-form-dialog">取消</button><button id="folder-form-submit" class="dialog-primary" type="submit">创建文件夹</button></footer>
      </form>
    </dialog>
    <dialog id="folder-picker-dialog" class="folder-dialog folder-picker-dialog">
      <form id="folder-picker-form" method="dialog">
        <header><div><span>MOVE TO</span><h2 id="folder-picker-title">选择文件夹</h2></div><button class="dialog-icon-button" type="button" data-close-dialog="folder-picker-dialog">×</button></header>
        <p id="folder-picker-copy" class="dialog-copy">选择论文要保存到的位置。</p>
        <div id="folder-picker-tree" class="dialog-folder-tree"></div>
        <footer><button class="dialog-secondary" type="button" data-close-dialog="folder-picker-dialog">取消</button><button class="dialog-primary" type="submit">选择此文件夹</button></footer>
      </form>
    </dialog>
    <dialog id="folder-delete-dialog" class="folder-dialog compact-dialog">
      <form id="folder-delete-form" method="dialog">
        <header><div><span>DELETE</span><h2>删除文件夹</h2></div><button class="dialog-icon-button" type="button" data-close-dialog="folder-delete-dialog">×</button></header>
        <p id="folder-delete-copy" class="dialog-copy"></p>
        <footer><button class="dialog-secondary" type="button" data-close-dialog="folder-delete-dialog">取消</button><button class="dialog-danger" type="submit">删除</button></footer>
      </form>
    </dialog>
    <dialog id="paper-note-dialog" class="paper-note-viewer">
      <header><div><span>MARKDOWN NOTE</span><h2 id="library-paper-note-title">论文笔记</h2></div><button class="dialog-icon-button" type="button" data-close-dialog="paper-note-dialog">×</button></header>
      <div id="library-paper-note-content" class="paper-note-viewer-content"><p>正在读取笔记…</p></div>
      <footer><a id="library-paper-note-edit" href="/app?mode=paper_reading">进入精读页编辑</a><button type="button" data-close-dialog="paper-note-dialog">关闭</button></footer>
    </dialog>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="/static/library/app.js"></script>
  </body>
</html>
