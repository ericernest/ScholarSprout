<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · ScholarSprout 科研萌芽</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17221d;background:#f5f7f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,430px);background:white;border:1px solid #e3e9e4;border-radius:22px;padding:36px;box-shadow:0 18px 60px #193c2510}
    .brand{font-size:13px;font-weight:700;letter-spacing:.08em;color:#28734b;text-align:center}
    h1{text-align:center;font-size:26px;margin:20px 0 8px}.sub{text-align:center;color:#69766e;font-size:14px;margin:0 0 28px}
    label{display:block;font-size:13px;font-weight:650;margin:16px 0 8px}
    input{width:100%;height:46px;border:1px solid #d7dfd9;border-radius:10px;padding:0 13px;font-size:15px;outline:none}
    input:focus{border-color:#32885b;box-shadow:0 0 0 3px #32885b18}
    button,.github{height:46px;border-radius:10px;border:0;width:100%;font-weight:650;font-size:14px;cursor:pointer}
    button.primary{margin-top:16px;background:#26764b;color:#fff}button.secondary{background:#edf3ef;color:#234b35;width:auto;padding:0 14px;white-space:nowrap}
    .code-row{display:flex;gap:8px}.code-row input{min-width:0}
    .github{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;border:1px solid #d7dfd9;background:#fff;color:#202b24;text-decoration:none}
    .divider{display:flex;align-items:center;gap:12px;color:#879189;font-size:12px;margin:22px 0 0}.divider:before,.divider:after{content:"";height:1px;background:#e7ece8;flex:1}
    #message{min-height:22px;margin:12px 0 0;font-size:13px;color:#a13c32;line-height:1.5}#message.ok{color:#26764b}
    .foot{text-align:center;color:#89938c;font-size:11px;margin-top:22px;line-height:1.6}
    @media(max-width:480px){main{padding:28px 22px}}
  </style>
</head>
<body>
<main>
  <div class="brand">SCHOLARSPROUT · 科研萌芽</div>
  <h1>欢迎回来</h1>
  <p class="sub">登录账号，继续你的科研探索</p>
  <form id="email-form">
    <label for="email">邮箱地址</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="254">
    <label for="code">邮箱验证码</label>
    <div class="code-row">
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" required minlength="6" maxlength="6">
      <button class="secondary" type="button" id="send">获取验证码</button>
    </div>
    <button class="primary" type="submit" id="verify">邮箱登录 / 注册</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="divider">其他登录方式</div>
  <a class="github" href="/api/auth/github/start" id="github">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.15 3.04 1.64.1-.72.39-1.2.7-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
    使用 GitHub 登录
  </a>
  <div class="foot">登录即表示你同意遵守科研萌芽的服务条款与隐私政策。</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const message = (text, ok=false) => { $("message").textContent=text; $("message").className=ok?"ok":""; };
$("send").addEventListener("click", async () => {
  const email=$("email").value.trim();
  if(!email){message("请先填写邮箱地址。");$("email").focus();return;}
  $("send").disabled=true;
  try{
    const r=await fetch("/api/auth/email/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail||"验证码发送失败。");
    message(data.message||"验证码已发送，请检查邮箱。",true);
  }catch(e){message(e.message||"验证码发送失败。");}
  finally{setTimeout(()=>$("send").disabled=false,3000);}
});
$("email-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const email=$("email").value.trim(),code=$("code").value.trim();
  try{
    const r=await fetch("/api/auth/email/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,code})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail||"登录失败。");
    message("登录成功，正在进入科研萌芽……",true);
    location.assign("/");
  }catch(e){message(e.message||"登录失败。");}
});
const params=new URLSearchParams(location.search);
if(params.has("error")) message("GitHub 授权未完成，请重试。");
</script>
</body>
</html>
