[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NoviceSynapse"
version = "0.1.0"
description = "NoviceSynapse - AI Research Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "openai>=1.0,<2.0",
    "typer>=0.12,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
novicesynapse = "cli.main:app"

[tool.setuptools.packages.find]
include = ["agents*", "bus*", "channels*", "cli*", "config*", "doctor*", "gateway*", "handlers*", "models*", "runtime*", "services*", "tools*"]

[tool.setuptools.package-data]
agents = ["profiles.json"]
