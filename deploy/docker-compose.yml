services:
  gateway:
    build:
      context: ..
    ports:
      - "8000:8000"
    environment:
      DOMAIN_ONBOARDING_AUDIT_DIR: /var/lib/scholarsprout/audit
      DOMAIN_ONBOARDING_AUDIT_FSYNC: "1"
      DOMAIN_ONBOARDING_JOB_DB: /var/lib/scholarsprout/jobs/domain_onboarding.sqlite3
      DOMAIN_ONBOARDING_JOB_TOKEN_SECRET: ${DOMAIN_ONBOARDING_JOB_TOKEN_SECRET:?set DOMAIN_ONBOARDING_JOB_TOKEN_SECRET}
      DOMAIN_ONBOARDING_JOB_WORKERS: ${DOMAIN_ONBOARDING_JOB_WORKERS:-2}
      DOMAIN_ONBOARDING_JOB_QUEUE_SIZE: ${DOMAIN_ONBOARDING_JOB_QUEUE_SIZE:-20}
      DOMAIN_ONBOARDING_JOB_OWNER_ACTIVE_LIMIT: ${DOMAIN_ONBOARDING_JOB_OWNER_ACTIVE_LIMIT:-2}
      DOMAIN_ONBOARDING_JOB_SUBMISSIONS_PER_MINUTE: ${DOMAIN_ONBOARDING_JOB_SUBMISSIONS_PER_MINUTE:-10}
      DOMAIN_ONBOARDING_JOB_RETENTION_SECONDS: ${DOMAIN_ONBOARDING_JOB_RETENTION_SECONDS:-604800}
      DOMAIN_ONBOARDING_JOB_RECOVERY_STALE_SECONDS: ${DOMAIN_ONBOARDING_JOB_RECOVERY_STALE_SECONDS:-900}
      DOMAIN_ONBOARDING_EMBEDDING_MODEL: ${DOMAIN_ONBOARDING_EMBEDDING_MODEL:-}
      DOMAIN_ONBOARDING_PLANNING_MODELS: ${DOMAIN_ONBOARDING_PLANNING_MODELS:-}
      DOMAIN_ONBOARDING_GENERATION_MODELS: ${DOMAIN_ONBOARDING_GENERATION_MODELS:-}
      DOMAIN_ONBOARDING_DEVELOPMENT_MODELS: ${DOMAIN_ONBOARDING_DEVELOPMENT_MODELS:-}
      DOMAIN_ONBOARDING_LANDSCAPE_MODELS: ${DOMAIN_ONBOARDING_LANDSCAPE_MODELS:-}
      DOMAIN_ONBOARDING_LEARNING_PATH_MODELS: ${DOMAIN_ONBOARDING_LEARNING_PATH_MODELS:-}
      DOMAIN_ONBOARDING_REPAIR_MODELS: ${DOMAIN_ONBOARDING_REPAIR_MODELS:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
    volumes:
      - ${SCHOLARSPROUT_CONFIG_DIR:?set SCHOLARSPROUT_CONFIG_DIR}:/home/scholarsprout/.scholarsprout:ro
      - domain_onboarding_audit:/var/lib/scholarsprout/audit
      - domain_onboarding_jobs:/var/lib/scholarsprout/jobs
    restart: unless-stopped

volumes:
  domain_onboarding_audit:
  domain_onboarding_jobs:
